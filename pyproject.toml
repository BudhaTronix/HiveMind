[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-learning"
version = "0.1.0"
description = "A local-first, educational multi-agent research system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Budhaditya Mukhopadhyay" },
]
dependencies = [
  "aiosqlite>=0.20,<1",
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9,<10",
  "httpx>=0.27,<1",
  "ollama>=0.4,<1",
  "openai>=1.60,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
mem0 = ["mem0ai>=0.1,<2"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
hivemind = "hivemind.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

